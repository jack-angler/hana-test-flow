<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>테스트 로그인</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
        color: #073b35;
        background:
          linear-gradient(120deg, rgba(0, 157, 133, 0.11), transparent 42%),
          linear-gradient(180deg, #f7fbfa 0%, #eef7f4 100%);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .box {
        width: min(100%, 420px);
        padding: 34px;
        border: 1px solid rgba(0, 117, 100, 0.16);
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 24px 60px rgba(10, 80, 72, 0.14);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 30px;
      }

      .brand img {
        width: 50px;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.25;
      }

      h1 span {
        display: block;
        margin-top: 4px;
        color: #00856f;
        font-size: 17px;
      }

      .accounts {
        display: grid;
        gap: 10px;
      }

      .select-box {
        margin-top: 22px;
        padding-top: 20px;
        border-top: 1px solid rgba(0, 117, 100, 0.14);
      }

      label {
        display: block;
        margin-bottom: 12px;
      }

      label span {
        display: block;
        margin-bottom: 8px;
        color: #314b47;
        font-size: 14px;
        font-weight: 700;
      }

      select {
        width: 100%;
        height: 48px;
        border: 1px solid #c9d9d6;
        border-radius: 6px;
        padding: 0 14px;
        color: #092f2a;
        background: #fbfdfc;
        font-size: 15px;
      }

      select:focus {
        border-color: #00856f;
        outline: 3px solid rgba(0, 133, 111, 0.16);
      }

      .account {
        width: 100%;
        min-height: 58px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border: 1px solid #bdd2ce;
        border-radius: 6px;
        padding: 0 16px;
        color: #073b35;
        background: #fbfdfc;
        cursor: pointer;
      }

      .account:hover {
        border-color: #00856f;
        background: #f2faf8;
      }

      .account:disabled {
        cursor: default;
        opacity: 0.7;
      }

      .account strong {
        font-size: 18px;
      }

      .account span {
        color: #00856f;
        font-size: 14px;
        font-weight: 800;
      }

      .message {
        margin: 16px 0 0;
        color: #b42318;
        font-size: 14px;
        font-weight: 700;
        white-space: pre-wrap;
      }

      .link {
        width: 100%;
        margin-top: 18px;
        border: 0;
        color: #00856f;
        background: transparent;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="box">
      <div class="brand">
        <img src="../hana-ci.svg" alt="" />
        <h1>테스트 로그인<span>계정 선택</span></h1>
      </div>

      <div class="accounts" id="accounts"></div>

      <div class="select-box">
        <label>
          <span>전체 계정 선택</span>
          <select id="userSelect">
            <option value="">계정 불러오는 중</option>
          </select>
        </label>
        <button type="button" class="account" id="selectLogin">
          <strong>선택 계정</strong><span>로그인</span>
        </button>
      </div>

      <p class="message" id="message" hidden></p>

      <button type="button" class="link" id="normalLogin">
        일반 로그인으로 이동
      </button>
    </main>

    <script>
      const API_BASE_URL = "https://honeyangler.gtz.kr/app/hana-test-flow/api";
      const accounts = [
        { loginId: "P260511", label: "P260511" },
        { loginId: "admin", label: "admin" },
        { loginId: "nicecast", label: "nicecast" },
      ];
      const accountsEl = document.querySelector("#accounts");
      const messageEl = document.querySelector("#message");
      const normalLoginEl = document.querySelector("#normalLogin");
      const userSelectEl = document.querySelector("#userSelect");
      const selectLoginEl = document.querySelector("#selectLogin");

      const setMessage = (message) => {
        messageEl.hidden = !message;
        messageEl.textContent = message;
      };

      const setLoading = (loginId) => {
        document.querySelectorAll(".account").forEach((button) => {
          button.disabled = loginId !== "";
          button.querySelector("span").textContent =
            button.dataset.loginId === loginId ? "로그인 중" : "클릭해서 로그인";
        });
        selectLoginEl.querySelector("span").textContent =
          loginId === "selected" ? "로그인 중" : "로그인";
        userSelectEl.disabled = loginId !== "";
      };

      const login = async (account) => {
        setMessage("");
        const loadingId = account.loginId ?? "selected";
        setLoading(loadingId);

        try {
          const response = await fetch(`${API_BASE_URL}/test-login.php`, {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              user_id: account.id,
              login_id: account.loginId,
            }),
          });
          const data = await response.json().catch(() => null);

          if (!response.ok) {
            throw new Error(data?.message ?? "로그인에 실패했습니다.");
          }

          window.location.href = "../";
        } catch (error) {
          setMessage(error.message);
        } finally {
          setLoading("");
        }
      };

      const loadUsers = async () => {
        try {
          const response = await fetch(`${API_BASE_URL}/test-login.php`, {
            credentials: "include",
          });
          const data = await response.json().catch(() => null);

          if (!response.ok) {
            throw new Error(data?.message ?? "계정 목록을 불러오지 못했습니다.");
          }

          userSelectEl.innerHTML =
            '<option value="">계정을 선택해주세요</option>';
          (data.users ?? []).forEach((user) => {
            const option = document.createElement("option");
            option.value = user.id;
            option.textContent = `${user.organization} / ${user.name} (${user.login_id})`;
            userSelectEl.appendChild(option);
          });
        } catch (error) {
          userSelectEl.innerHTML =
            '<option value="">계정 목록 로딩 실패</option>';
          setMessage(error.message);
        }
      };

      accounts.forEach((account) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "account";
        button.dataset.loginId = account.loginId;
        button.innerHTML = `<strong>${account.label}</strong><span>클릭해서 로그인</span>`;
        button.addEventListener("click", () => login(account));
        accountsEl.appendChild(button);
      });

      selectLoginEl.addEventListener("click", () => {
        if (!userSelectEl.value) {
          setMessage("로그인할 계정을 선택해주세요.");
          return;
        }

        login({ id: Number(userSelectEl.value) });
      });

      normalLoginEl.addEventListener("click", () => {
        window.location.href = "../";
      });

      loadUsers();
    </script>
  </body>
</html>
